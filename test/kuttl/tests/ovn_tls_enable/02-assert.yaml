apiVersion: ovn.openstack.org/v1beta1
kind: OVNDBCluster
metadata:
  name: ovndbcluster-nb-sample
spec:
  replicas: 3
status:
  readyCount: 3
---
apiVersion: ovn.openstack.org/v1beta1
kind: OVNDBCluster
metadata:
  name: ovndbcluster-sb-sample
spec:
  replicas: 3
status:
  readyCount: 3
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # check the DB uri scheme is ssl
  - script: |
      template='{{.status.internalDbAddress}}{{"\n"}}'
      regex="ssl:.*"
      dbUri=$(oc get -n $NAMESPACE OVNDBCluster ovndbcluster-sb-sample -o go-template="$template")
      matches=$(echo "$dbUri" | sed -e "s?$regex??")
      if [[ -n "$matches" ]]; then
        exit 1
      fi
  # Check ovn connect is pssl
  - script: |
      sb_pod=$(oc get pod -n $NAMESPACE -l service=ovsdbserver-sb -o name|head -1)
      oc rsh -n $NAMESPACE ${sb_pod} ovn-sbctl --no-leader-only  get-connection | grep -q pssl
  # Check we have 3 servers using ssl
  - script: |
      ../../common/scripts/check_cluster_status.sh nb 3 ssl
  - script: |
      ../../common/scripts/check_cluster_status.sh sb 3 ssl
  # Check ovn-controller-ovs pods were NOT restarted/recreated by enabling TLS.
  # Compare the current pods (name + uid) against the snapshot taken in step 02
  # before the TLS rollout; a changed uid means the pod was recreated.
  - script: |
      snapshot=/tmp/ovn-controller-ovs-snapshot-$NAMESPACE.txt
      if [[ ! -f "$snapshot" ]]; then
        echo "Snapshot $snapshot not found"
        exit 1
      fi
      current=$(oc get pods -n $NAMESPACE -l service=ovn-controller-ovs -o json | \
        jq -r '.items[] | "\(.metadata.name) \(.metadata.uid)"' | sort)
      if [[ "$current" != "$(cat $snapshot)" ]]; then
        echo "ovn-controller-ovs pods were restarted/recreated after enabling TLS"
        echo "--- before ---"; cat "$snapshot"
        echo "--- after ---"; echo "$current"
        exit 1
      fi
