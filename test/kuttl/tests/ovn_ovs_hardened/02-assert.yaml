apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ovn-controller-ovs
spec:
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: ovsdb-server-init
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_NICE
          privileged: true
          readOnlyRootFilesystem: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: ovsdb-server
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_NICE
          privileged: true
          readOnlyRootFilesystem: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
      - name: ovs-vswitchd
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_NICE
          privileged: true
          readOnlyRootFilesystem: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
status:
  numberMisscheduled: 0
